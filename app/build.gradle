plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cwcontest'
    compileSdk 34

    defaultConfig {
        applicationId "com.cwcontest"
        minSdk 26          // Android 8.0 – required for UsbSerialPort RTS/DTR API
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Keep CI green: report lint problems without failing the APK build.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ── Kotlin Coroutines ─────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── Core Android ─────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ── USB Serial (CH340, CP210x, FTDI, PL2303, CDC) ────────────────
    // https://github.com/mik3y/usb-serial-for-android
    implementation 'com.github.mik3y:usb-serial-for-android:3.4.6'

    // ── Tests ─────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
